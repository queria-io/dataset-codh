$schema: https://tabledoc.queria.io/schemas/dataset/v1.json
name: codh
title: 歴史的行政区域データセット（CODH）
description: |-
  1889 年の市制・町村制以降に存在した市区町村の一覧と、基準日ごとの境界です。合併や改称で消えた市町村にも ID があり、現在のどの市区町村に入るかを持ちます。

  出典：『歴史的行政区域データセットβ版』（CODH作成） doi:10.20676/00000447。Queria が加工したものです。
image: cover.png
topics:
  - 市区町村
  - 行政区域
  - 市町村合併
  - 廃置分合
  - 旧市町村
  - 境界
  - 歴史地名
  - Geoshape
  - CODH
homepage: https://github.com/queria-io/dataset-codh
language: ja
licenses:
  - CC-BY-4.0
  - JP-MLIT-NLFTP

