schema: city
name: boundary
title: 市区町村の境界（基準日ごと）
description: |-
  基準日ごとの市区町村の境界です。1 行が 1 基準日の 1 市区町村で、1889〜2023 年の 111 時点を収録しています。

  - 出典が国土数値情報（n03）と行政界変遷データベース（hensen）の 2 つあり、source で分かれます
  - hensen の 1889〜1919 年は一部の県だけです
  - 1985 年以前の境界は資料が違い、隣と小さく重なったり離れたりします
primary_key: [reference_date, geoshape_city_id]
sources:
  - path: https://geoshape.ex.nii.ac.jp/city/time/
fields:
  - name: reference_date
    title: 基準日
    description: hensen の時点は年だけが判明していて、12 月 31 日にしています
  - name: geoshape_city_id
    title: Geoshape 市区町村 ID
  - name: source
    title: 境界の出典
    description: n03（国土数値情報 行政区域データ）、hensen（行政界変遷データベース）
    annotations: { queria: { semantic: { role: dimension } } }
  - name: prefecture
    title: 都道府県
    description: その時点の原典の値
    annotations: { queria: { semantic: { role: entity, name: prefecture } } }
  - name: subprefecture
    title: 支庁・振興局
    description: 北海道の支庁・振興局など。その時点の原典の値
  - name: county_or_city
    title: 郡・政令指定都市
    description: その時点の原典の値。hensen では複数の郡のことがあります
  - name: name
    title: 市区町村名
    description: その時点の原典の値（接尾辞つき）
  - name: city_code
    title: 市区町村コード（5 桁）
    description: その時点の原典の値。コードのない市町村は NULL
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: geometry
    title: 境界
    description: マルチポリゴン（経緯度）
