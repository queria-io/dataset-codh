# PR のビルド確認用。公開ストレージには書かず、手元の DuckDB ファイルに作る
codh:
  target: ci
  outputs:
    ci:
      type: duckdb
      path: target/codh.duckdb
      schema: main
      threads: 1
      extensions:
        - httpfs
        - ducklake
        - spatial
      # nlftp を data.queria.io から読むので、ビルドとして名乗る。無いと data.queria.io の
      # 利用統計に PR のビルドが利用者として混ざる
      config_options:
        custom_user_agent: "{{ env_var('QUERIA_USER_AGENT', 'queria-build/ci') }}"
      attach:
        - path: "ducklake:https://data.queria.io/datasets/queria/nlftp/ducklake.duckdb"
          alias: nlftp
          is_ducklake: true
          read_only: true
