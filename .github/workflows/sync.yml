name: Apply

on:
  push:
    branches: [main]
  # 元のデータセットは 2023 年 10 月の版から更新されていない。定期実行はせず、手で回す
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@d3bbf1d881a8ee5856df5a5d7a92973d233a1525
    with:
      dataset_name: codh
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
