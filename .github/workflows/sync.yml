name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  # 元のデータセットは 2023 年 10 月の版から更新されていない。定期実行はせず、手で回す
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@609f93e1080379ab78f334483c935d65853246c9
    with:
      dataset_name: codh
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
