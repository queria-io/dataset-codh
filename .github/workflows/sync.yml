name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  # 元のデータセットは 2023 年 10 月の版から更新されていない。定期実行はせず、手で回す
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: codh
    secrets: inherit
