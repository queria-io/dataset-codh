name: Build

# 公開せずにパイプラインと dbt build だけを回す。境界は全部で 2.5GB あるので、
# 3 時点（行政界変遷データベースの 1889 年、国土数値情報の 1950 年と 2023 年）だけ取って形を確かめる
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python -c "import main; main.download_geoshape()"
        env:
          CODH_DATES: "18891231,19501001,20230101"
      - run: uv run dbt build --profiles-dir ci
